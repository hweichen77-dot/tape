[package]
name = "tape"
version = "1.1.0"
description = "Tape — day trading on a market that does not exist"
edition = "2021"

[lib]
name = "tape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
